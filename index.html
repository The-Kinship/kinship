<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kinship</title>
<meta name="description" content="The Kinship: a heavy role-play faction on Crystal / Mateus.">
<style>
  :root {
    --bg: #11141b;
    --panel: #181c26;
    --edge: #2c3242;
    --text: #e9e6dc;
    --muted: #a3a9b8;
    --gold: #d4a94f;
    --gold-soft: #f0d58a;
    --purple: #8b5cf6;
    --silver: #c4cad6;
    --green: #4f9d5d;
    --red: #d9472b;
    --sects: linear-gradient(90deg, var(--purple), var(--silver), var(--green), var(--red));
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 520px at 0% 0%, rgba(139,92,246,.13), transparent 62%),
      radial-gradient(900px 520px at 100% 0%, rgba(217,71,43,.10), transparent 62%),
      radial-gradient(900px 600px at 0% 100%, rgba(79,157,93,.10), transparent 62%),
      radial-gradient(900px 600px at 100% 100%, rgba(196,202,214,.06), transparent 62%),
      var(--bg);
    background-repeat: no-repeat;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.65;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 48px; }

  /* ---------- Header: name | logo | tagline ---------- */
  .masthead {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
  }
  .masthead h1 {
    margin: 0; font-size: clamp(1.6rem, 3.4vw, 2.5rem);
    letter-spacing: .04em; color: var(--gold-soft); text-align: left;
    text-shadow: 0 2px 18px rgba(212,169,79,.25);
  }
  .tagline {
    margin: 0; text-align: right; font-style: italic;
    color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.25rem);
  }
  .logo {
    width: clamp(170px, 28vw, 280px); aspect-ratio: 1;
    -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
            mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; mix-blend-mode: lighten; }

  .sect-rule { height: 3px; border-radius: 3px; background: var(--sects); opacity: .85; margin: 6px auto 0; max-width: 760px; }

  /* ---------- Stats bar ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    margin: 16px auto 18px; max-width: 760px;
    border: 1px solid var(--edge); border-radius: 999px;
    background: var(--panel); overflow: hidden;
  }
  .stat { padding: 10px 14px; text-align: center; border-left: 1px solid var(--edge); }
  .stat:first-child { border-left: 0; }
  .stat small {
    display: block; font-size: .68rem; letter-spacing: .18em;
    text-transform: uppercase; color: var(--gold);
  }
  .stat b { font-weight: normal; font-size: 1.1rem; }

  /* ---------- About ---------- */
  .about {
    max-width: 760px; margin: 0 auto 26px; text-align: center;
    color: var(--muted); font-size: 1.05rem; white-space: pre-line;
  }

  /* ---------- Current plot: the star of the page ---------- */
  .plot-panel {
    position: relative; margin: 0 auto 18px;
    padding: 30px 28px 26px;
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(212,169,79,.10), rgba(24,28,38,.95) 40%),
      var(--panel);
    border: 1px solid var(--gold);
    box-shadow: 0 0 0 1px rgba(212,169,79,.25), 0 0 38px rgba(212,169,79,.22), inset 0 0 40px rgba(212,169,79,.05);
  }
  .plot-panel::before, .plot-panel::after {
    content: "\2756"; position: absolute; top: 10px; color: var(--gold); opacity: .8; font-size: 1rem;
  }
  .plot-panel::before { left: 14px; }
  .plot-panel::after  { right: 14px; }
  .plot-label {
    text-align: center; margin: 0 0 14px;
    font-size: .85rem; letter-spacing: .38em; text-transform: uppercase; color: var(--gold);
  }
  .plot { text-align: center; padding: 14px 0; border-top: 1px solid rgba(212,169,79,.25); }
  .plot:first-of-type { border-top: 0; padding-top: 0; }
  .plot h2 {
    margin: 0 0 6px; font-weight: normal; color: var(--gold-soft);
    font-size: clamp(1.5rem, 3.4vw, 2.2rem); text-shadow: 0 2px 20px rgba(212,169,79,.3);
  }
  .plot p { margin: 0 auto; max-width: 720px; color: var(--text); font-size: 1.08rem; white-space: pre-line; }

  /* ---------- Announcements ---------- */
  .news {
    max-width: 800px; margin: 0 auto 28px;
    border: 1px solid var(--edge); border-radius: 10px; background: var(--panel);
    padding: 14px 20px; border-left: 3px solid var(--purple);
    border-image: linear-gradient(180deg, var(--purple), var(--silver), var(--green), var(--red)) 1;
    border-image-width: 0 0 0 3px;
  }
  .news h3 {
    margin: 0 0 6px; font-size: .75rem; letter-spacing: .22em;
    text-transform: uppercase; color: var(--gold); font-weight: normal;
  }
  .news div { color: var(--muted); white-space: pre-line; }

  /* ---------- Three image buttons ---------- */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
  .card {
    position: relative; display: flex; flex-direction: column; text-decoration: none; color: var(--text);
    border: 1px solid var(--edge); border-radius: 16px; overflow: hidden;
    background: var(--panel);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; z-index: 2; background: var(--gold); }
  #cardSects::before { background: var(--sects); }
  #cardJoin::before { background: linear-gradient(90deg, var(--gold), var(--red)); }
  .card .pic { aspect-ratio: 1; overflow: hidden; background: #0d1016; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
  .card .cap { padding: 12px 14px 16px; text-align: center; border-top: 1px solid var(--edge); }
  .card .cap b { display: block; font-size: 1.25rem; font-weight: normal; letter-spacing: .06em; color: var(--gold-soft); }
  .card .cap span { font-size: .9rem; color: var(--muted); }
  a.card:hover, a.card:focus-visible {
    transform: translateY(-4px); border-color: var(--gold);
    box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 26px rgba(212,169,79,.28);
  }
  a.card:hover img { transform: scale(1.04); }
  .card.soon { cursor: default; filter: saturate(.75); }
  .badge {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    background: rgba(10,12,17,.85); border: 1px solid var(--gold); color: var(--gold-soft);
    font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 999px;
  }

  /* ---------- Footer ---------- */
  footer { text-align: center; padding-top: 6px; color: var(--muted); font-size: .9rem; }
  .mail {
    display: inline-block; margin-top: 6px; padding: 8px 20px;
    border: 1px solid var(--edge); border-radius: 999px; color: var(--gold-soft);
    text-decoration: none; background: var(--panel);
  }
  .mail:hover { border-color: var(--gold); box-shadow: 0 0 18px rgba(212,169,79,.25); }

  [hidden] { display: none !important; }

  /* ---------- Phones ---------- */
  @media (max-width: 760px) {
    .masthead { grid-template-columns: 1fr; justify-items: center; gap: 8px; }
    .masthead h1, .tagline { text-align: center; }
    .masthead .logo { order: -1; }
    .stats { border-radius: 16px; }
    .stat small { font-size: .6rem; letter-spacing: .12em; }
    .stat b { font-size: .95rem; }
    .cards { grid-template-columns: 1fr; max-width: 360px; margin-left: auto; margin-right: auto; }
    .plot-panel { padding: 26px 18px 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Name | Logo | Tagline -->
  <header class="masthead">
    <h1 id="name">The Kinship</h1>
    <div class="logo"><img id="logo" src="images/kinship-crest.jpg" alt="The Kinship crest" onerror="this.onerror=null;this.src=DEFAULT_LOGO"></div>
    <p class="tagline" id="tagline"></p>
  </header>

  <div class="sect-rule" aria-hidden="true"></div>

  <!-- Data center | World | Members -->
  <div class="stats">
    <div class="stat"><small>Data Center</small><b id="dc">-</b></div>
    <div class="stat"><small>World</small><b id="world">-</b></div>
    <div class="stat"><small>Members</small><b id="members">-</b></div>
  </div>

  <!-- About -->
  <p class="about" id="description">Loading…</p>

  <!-- Current plot (stands out) -->
  <section class="plot-panel" aria-label="Current plot">
    <p class="plot-label">Current Plot</p>
    <div id="plots">Loading…</div>
  </section>

  <!-- Announcements -->
  <section class="news" id="newsBox" hidden>
    <h3>Announcements &amp; News</h3>
    <div id="news"></div>
  </section>

  <!-- The Kin | The Sects | Join -->
  <nav class="cards" aria-label="Explore">
    <a class="card soon" id="cardKin" href="#" aria-disabled="true">
      <span class="badge">Coming soon</span>
      <span class="pic"><img src="images/kin-emblem.jpg" alt=""></span>
      <span class="cap"><b>The Kin</b><span>Meet the faction</span></span>
    </a>
    <a class="card soon" id="cardSects" href="#" aria-disabled="true">
      <span class="badge">Coming soon</span>
      <span class="pic"><img src="images/sects-emblem.jpg" alt=""></span>
      <span class="cap"><b>The Sects</b><span>Find your calling</span></span>
    </a>
    <a class="card soon" id="cardJoin" href="#" aria-disabled="true">
      <span class="badge">Coming soon</span>
      <span class="pic"><img src="images/join-button.jpg" alt="" style="object-position:50% 40%"></span>
      <span class="cap"><b>Join the Kinship</b><span>Faction application</span></span>
    </a>
  </nav>

  <footer>
    Questions? Reach us at<br>
    <a class="mail" id="mail" href="mailto:Thekinship.ffxiv@gmail.com">Thekinship.ffxiv@gmail.com</a>
  </footer>
</div>

<script>
// ---- Your published Google Sheet links ----
const FACTION_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAGpMH_xMZvl3V_Pxo-e57S1D9Q2RhjpGxtN2romaYZer0CjAI3qlYzgZa4SUpNZsIbX0Dt3ag6-Jg/pub?gid=0&single=true&output=csv";
const PLOTS_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAGpMH_xMZvl3V_Pxo-e57S1D9Q2RhjpGxtN2romaYZer0CjAI3qlYzgZa4SUpNZsIbX0Dt3ag6-Jg/pub?gid=1197750534&single=true&output=csv";

const DEFAULT_LOGO = "images/kinship-crest.jpg";

// ---- Pages for the two cards (fill these in as we build the pages) ----
// Leave "" and the card shows "Coming soon". Example: kin: "kin.html"
const PAGES = { kin: "", sects: "" };

// Small CSV parser that handles quoted fields
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}

async function load(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return parseCSV(await res.text());
}

const $ = id => document.getElementById(id);
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "";
const safeImg = u => /^https?:\/\//i.test(u) || /^images\//i.test(u) ? u : "";

function enableCard(id, href, external) {
  const el = $(id);
  if (!href) return;
  el.href = href;
  el.classList.remove("soon");
  el.removeAttribute("aria-disabled");
  el.querySelector(".badge").remove();
  if (external) { el.target = "_blank"; el.rel = "noopener"; }
}

async function main() {
  enableCard("cardKin", PAGES.kin);
  enableCard("cardSects", PAGES.sects);

  try {
    const rows = await load(FACTION_URL);
    const d = {};
    rows.slice(1).forEach(r => { d[(r[0] || "").trim().toLowerCase()] = (r[1] || "").trim(); });

    if (d.faction_name) { $("name").textContent = d.faction_name; document.title = d.faction_name; }
    $("tagline").textContent = d.tagline || "";
    $("description").textContent = d.description || "";
    $("dc").textContent = d.data_center || "-";
    $("world").textContent = d.world || "-";
    $("members").textContent = d.member_count || "-";

    const logo = safeImg(d.logo_url);
    if (logo) {                              // a custom logo link; if it is broken, fall back to the built-in crest
      const probe = new Image();
      probe.onload = () => { $("logo").src = logo; };
      probe.src = logo;
    }

    if (d.announcements) { $("news").textContent = d.announcements; $("newsBox").hidden = false; }

    const join = safeUrl(d.application_url);
    if (join) enableCard("cardJoin", join, true);

    if (d.contact_email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.contact_email)) {
      $("mail").href = "mailto:" + d.contact_email; $("mail").textContent = d.contact_email;
    }
  } catch (e) {
    $("description").textContent = "Couldn't load faction info right now. Please try again later.";
  }

  try {
    const rows = await load(PLOTS_URL);
    const head = rows[0].map(h => h.trim().toLowerCase());
    const idx = n => head.indexOf(n);
    const plots = rows.slice(1)
      .map(r => ({ title: r[idx("title")] || "", summary: r[idx("summary")] || "", status: (r[idx("status")] || "").trim().toLowerCase(), order: parseFloat(r[idx("order")]) || 999 }))
      .filter(p => p.status === "active" && p.title)
      .sort((a, b) => a.order - b.order);
    const box = $("plots"); box.textContent = "";
    if (!plots.length) { box.textContent = "No active plot right now. Check back soon."; box.style.textAlign = "center"; return; }
    plots.forEach(p => {
      const el = document.createElement("div"); el.className = "plot";
      const h = document.createElement("h2"); h.textContent = p.title;
      const s = document.createElement("p"); s.textContent = p.summary;
      el.append(h, s); box.appendChild(el);
    });
  } catch (e) {
    $("plots").textContent = "Couldn't load the plot right now. Please try again later.";
  }
}
main();
</script>
</body>
</html>
