<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Kinship</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #181b24;
    --edge: #2a2f3d;
    --text: #e6e8ee;
    --muted: #9aa1b2;
    --accent: #c9a24b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.6;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; gap: 20px; align-items: center; margin-bottom: 28px; }
  .logo {
    width: 96px; height: 96px; flex: 0 0 96px;
    border: 1px solid var(--edge); border-radius: 12px;
    background: var(--panel); display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: var(--accent); overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  h1 { margin: 0; font-size: 2rem; letter-spacing: 0.02em; }
  .tagline { margin: 4px 0 0; color: var(--muted); font-style: italic; }
  .panel {
    background: var(--panel); border: 1px solid var(--edge);
    border-radius: 12px; padding: 20px 22px; margin-bottom: 20px;
  }
  .panel h2 {
    margin: 0 0 10px; font-size: 0.85rem; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--accent);
  }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .chip {
    border: 1px solid var(--edge); border-radius: 999px;
    padding: 4px 14px; font-size: 0.9rem; color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: normal; }
  .plot { padding: 12px 0; border-top: 1px solid var(--edge); }
  .plot:first-of-type { border-top: 0; padding-top: 0; }
  .plot h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .plot p { margin: 0; color: var(--muted); }
  .btn {
    display: inline-block; margin-top: 4px; padding: 10px 20px;
    border: 1px solid var(--accent); border-radius: 8px;
    color: var(--accent); text-decoration: none;
  }
  .btn:hover { background: var(--accent); color: var(--bg); }
  .note { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">K</div>
    <div>
      <h1 id="name">The Kinship</h1>
      <p class="tagline" id="tagline"></p>
    </div>
  </header>

  <section class="panel">
    <h2>About Us</h2>
    <div id="description" class="note">Loading…</div>
    <div class="stats">
      <span class="chip">Data Center: <b id="dc">-</b></span>
      <span class="chip">World: <b id="world">-</b></span>
      <span class="chip">Members: <b id="members">-</b></span>
    </div>
  </section>

  <section class="panel">
    <h2>Current Faction Plots</h2>
    <div id="plots" class="note">Loading…</div>
  </section>

  <section class="panel" id="joinPanel" hidden>
    <h2>Join Us</h2>
    <a class="btn" id="joinBtn" href="#">Apply to join</a>
  </section>
</div>

<script>
// ---- Your published Google Sheet links ----
const FACTION_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAGpMH_xMZvl3V_Pxo-e57S1D9Q2RhjpGxtN2romaYZer0CjAI3qlYzgZa4SUpNZsIbX0Dt3ag6-Jg/pub?gid=0&single=true&output=csv";
const PLOTS_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTAGpMH_xMZvl3V_Pxo-e57S1D9Q2RhjpGxtN2romaYZer0CjAI3qlYzgZa4SUpNZsIbX0Dt3ag6-Jg/pub?gid=1197750534&single=true&output=csv";

// Small CSV parser that handles quoted fields
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ""));
}

async function load(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return parseCSV(await res.text());
}

const $ = id => document.getElementById(id);
const safeUrl = u => /^https?:\/\//i.test(u) ? u : "";

async function main() {
  try {
    const rows = await load(FACTION_URL);
    const data = {};
    rows.slice(1).forEach(r => { data[(r[0] || "").trim().toLowerCase()] = (r[1] || "").trim(); });

    if (data.faction_name) { $("name").textContent = data.faction_name; document.title = data.faction_name; $("logo").textContent = data.faction_name.replace(/^the\s+/i, "").charAt(0).toUpperCase(); }
    $("tagline").textContent = data.tagline || "";
    $("description").textContent = data.description || "";
    $("dc").textContent = data.data_center || "-";
    $("world").textContent = data.world || "-";
    $("members").textContent = data.member_count || "-";

    const logo = safeUrl(data.logo_url);
    if (logo) {
      const img = new Image(); img.alt = "Logo";
      img.onload = () => { $("logo").textContent = ""; $("logo").appendChild(img); };
      img.src = logo;
    }
    const join = safeUrl(data.application_url);
    if (join) { $("joinBtn").href = join; $("joinPanel").hidden = false; }
  } catch (e) {
    $("description").textContent = "Couldn't load faction info right now. Please try again later.";
  }

  try {
    const rows = await load(PLOTS_URL);
    const head = rows[0].map(h => h.trim().toLowerCase());
    const idx = n => head.indexOf(n);
    const plots = rows.slice(1)
      .map(r => ({ title: r[idx("title")] || "", summary: r[idx("summary")] || "", status: (r[idx("status")] || "").trim().toLowerCase(), order: parseFloat(r[idx("order")]) || 999 }))
      .filter(p => p.status === "active" && p.title)
      .sort((a, b) => a.order - b.order);
    const box = $("plots"); box.textContent = "";
    if (!plots.length) { box.textContent = "No active plots right now. Check back soon."; return; }
    plots.forEach(p => {
      const d = document.createElement("div"); d.className = "plot";
      const h = document.createElement("h3"); h.textContent = p.title;
      const s = document.createElement("p"); s.textContent = p.summary;
      d.append(h, s); box.appendChild(d);
    });
  } catch (e) {
    $("plots").textContent = "Couldn't load plots right now. Please try again later.";
  }
}
main();
</script>
</body>
</html>
